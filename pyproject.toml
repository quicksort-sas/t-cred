[project]
name = "tcred"
version = "0.1.0"
description = "Temporal GraphRAG diagnostic dataset generation and evaluation tooling"
readme = "README.md"
authors = [
    { name = "Murad", email = "muradmustafayev03@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ftfy>=6.3.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "numpy>=2.3.0",
    "orjson>=3.11.9",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "ruff>=0.15.16",
    "tenacity>=9.1.4",
    "typer>=0.26.7",
]

[project.urls]
Repository = "https://github.com/quicksort-sas/t-cred"
"Annotation Tool" = "https://github.com/Muradmustafayev-03/tcred_annotation_tool"

[project.optional-dependencies]
metrics-neural = [
    "bert-score>=0.3.13,<0.4",
    "huggingface-hub>=0.34,<1",
    "joblib>=1.4,<2",
    "nltk>=3.9,<4",
    "scikit-learn>=1.7,<2",
    "scipy>=1.15,<2",
    "sentencepiece>=0.2,<0.3",
    "torch>=2.6,<3",
    "transformers>=4.53,<5",
]
metrics-trainable = [
    "accelerate>=1.10,<2",
    "datasketch>=1.6,<2",
    "datasets>=4.0,<5",
    "huggingface-hub>=0.34,<1",
    "joblib>=1.4,<2",
    "lemminflect>=0.2.3,<0.3",
    "numpy>=2.3,<3",
    "pyarrow>=18,<24",
    "pyyaml>=6,<7",
    "requests>=2.32,<3",
    "safetensors>=0.5,<1",
    "scikit-learn>=1.7,<2",
    "scipy>=1.15,<2",
    "torch>=2.6,<3",
    "transformers>=4.53,<5",
]

[project.scripts]
tcred = "tcred.cli:app"
tcred-sl = "tcred.trainable_metrics.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
